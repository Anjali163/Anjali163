name: Generate Snake Animation

on:
  schedule:
    # Run every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Snake Animation (Platane v3)
        uses: Platane/snk@v3
        with:
          github_user_name: heymayur69
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Create output directory
        run: |
          mkdir -p output
          if [ -f "dist/github-contribution-grid-snake.svg" ]; then
            cp dist/github-contribution-grid-snake.svg output/github-contribution-grid-snake.svg
            echo "✅ Snake animation generated successfully"
          else
            echo "⚠️ Snake animation file not found"
          fi

      - name: Push to GitHub
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if [ -d "output" ] && [ -n "$(ls -A output 2>/dev/null)" ]; then
            git add output/
            git commit -m "🐍 chore: generate snake animation" || echo "No changes to commit"
            git push origin main || echo "Push failed - check permissions"
          else
            echo "No output files to commit"
          fi
