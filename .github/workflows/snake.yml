name: Generate Contribution Snake Animation

on:
  schedule:
    # Run every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Generate Snake Animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: heymayur69
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push to GitHub
        uses: actions/github-script@v6
        with:
          script: |
            let fs = require('fs');
            let path = require('path');
            
            // Create output directory if it doesn't exist
            if (!fs.existsSync('output')) {
              fs.mkdirSync('output');
            }
            
            // Copy snake files
            if (fs.existsSync('dist/github-contribution-grid-snake.svg')) {
              fs.copyFileSync('dist/github-contribution-grid-snake.svg', 'output/github-contribution-grid-snake.svg');
            }
            if (fs.existsSync('dist/github-contribution-grid-snake-dark.svg')) {
              fs.copyFileSync('dist/github-contribution-grid-snake-dark.svg', 'output/github-contribution-grid-snake-dark.svg');
            }

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if [ -d "output" ] && [ -n "$(ls -A output)" ]; then
            git add output/
            git commit -m "Generate contribution snake animation" || echo "No changes to commit"
            git push
          fi
